all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    all-errors: false
    comments: true
    format-only: true
    fragment: false
    local-prefix: ""
    tab-indent: true
    tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/kevin-env/kevin/plugin:
    interfaces:
      Step:
      Downer:
      Exporter:
      ToolProvider:
  github.com/kevin-env/kevin/internal/command:
    config:
      dir: internal/command/commandtest
      filename: mocks.go
      pkgname: commandtest
    interfaces:
      Runner:
      Starter:
  github.com/kevin-env/kevin/internal/plugins/builtin/helm:
    interfaces:
      cli:
  github.com/kevin-env/kevin/internal/plugins/builtin/kubectl:
    interfaces:
      cli:
  github.com/kevin-env/kevin/internal/plugins/builtin/wait:
    interfaces:
      kubectlCLI:
  github.com/kevin-env/kevin/internal/plugins/builtin/kubernetes:
    interfaces:
      kindCLI:
      k3dCLI:
      minikubeCLI:
  github.com/kevin-env/kevin/internal/engine:
    interfaces:
      stepPlugin:
      routeTable:
      trafficRelay:
